<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop All Products | SK GRIP PRO</title>
  <meta name="description" content="Browse all SK GRIP PRO products. Search by name and filter by category.">
  <meta name="theme-color" content="#0a0a0a">

  <link rel="stylesheet" href="css/style.css">

  <style>
    .shop-wrap {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .shop-section {
      padding: 40px 0 24px;
    }

    .shop-toolbar select.filter-select {
      min-width: 190px;
    }

    .shop-note {
      margin: 0 0 28px;
      font-size: 0.9rem;
      color: #9ea2a9;
      text-align: center;
    }

    .shop-loading {
      padding: 48px 20px;
      text-align: center;
      color: #c9ccd1;
    }

    @media (max-width: 768px) {
      .shop-toolbar select.filter-select { width: 100%; }
    }
  </style>
</head>

<body>

  <!-- Shared header placeholder -->
  <div id="site-header"></div>

  <main id="main-content">

    <!-- Page heading -->
    <section class="page-header">
      <div class="container">
        <span class="eyebrow">SK GRIP PRO</span>
        <h1>Shop All Products</h1>
        <p>Browse our premium smartphone accessories. Search by name or filter by category.</p>
      </div>
    </section>

    <section class="shop-section">
      <div class="shop-wrap">

        <!-- Search, filter and sort -->
        <div class="shop-toolbar">
          <input
            type="search"
            id="product-search"
            placeholder="Search products..."
            aria-label="Search products"
            autocomplete="off">

          <select id="category-filter" class="filter-select" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>

          <select id="product-sort" class="filter-select" aria-label="Sort products">
            <option value="default">Sort: Default</option>
            <option value="name-asc">Name: A to Z</option>
            <option value="name-desc">Name: Z to A</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>

          <span id="results-count" aria-live="polite"></span>
        </div>

        <!-- Optional category buttons (filled by js/app.js if present) -->
        <div id="category-buttons" style="margin-bottom:24px"></div>

        <!-- Products are rendered here by js/app.js -->
        <div id="product-grid" aria-live="polite">
          <div class="shop-loading">Loading products...</div>
        </div>

        <noscript>
          <div class="skgp-empty">
            <h3>JavaScript is required</h3>
            <p>Please enable JavaScript in your browser to view our products, or contact us to place an order.</p>
          </div>
        </noscript>

        <p class="shop-note" style="margin-top:32px">
          Prices, shipping details and return conditions are confirmed before an order is placed.
        </p>

      </div>
    </section>

  </main>

  <!-- Shared footer placeholder -->
  <div id="site-footer"></div>

  <!-- Scripts: load in this order -->
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>

  <!-- Sorting for the dropdown (js/app.js does not include sorting) -->
  <script>
    (function () {
      "use strict";

      var grid = document.getElementById("product-grid");
      var sortSelect = document.getElementById("product-sort");
      if (!grid || !sortSelect) {
        return;
      }

      function priceOf(card) {
        var el = card.querySelector(".skgp-price-main");
        var value = el ? parseFloat(el.textContent.replace(/[^0-9.]/g, "")) : NaN;
        return isNaN(value) ? Infinity : value;
      }

      function nameOf(card) {
        var el = card.querySelector("h3");
        return el ? el.textContent.trim().toLowerCase() : "";
      }

      function applySort() {
        var list = grid.querySelector(".skgp-grid");
        if (!list) {
          return;
        }
        var cards = Array.prototype.slice.call(list.children);
        cards.forEach(function (card, i) {
          if (!card.hasAttribute("data-order")) {
            card.setAttribute("data-order", String(i));
          }
        });

        var mode = sortSelect.value;
        cards.sort(function (a, b) {
          switch (mode) {
            case "name-asc":
              return nameOf(a).localeCompare(nameOf(b));
            case "name-desc":
              return nameOf(b).localeCompare(nameOf(a));
            case "price-asc":
              return priceOf(a) - priceOf(b);
            case "price-desc":
              return (priceOf(b) === Infinity ? -1 : priceOf(b)) - (priceOf(a) === Infinity ? -1 : priceOf(a));
            default:
              return Number(a.getAttribute("data-order")) - Number(b.getAttribute("data-order"));
          }
        });

        cards.forEach(function (card) {
          list.appendChild(card);
        });
      }

      sortSelect.addEventListener("change", applySort);

      // Re-apply the chosen sort whenever the grid is redrawn (search or filter changes).
      if (window.MutationObserver) {
        new MutationObserver(applySort).observe(grid, { childList: true });
      }

      document.addEventListener("DOMContentLoaded", applySort);
    })();
  </script>
</body>
</html>
