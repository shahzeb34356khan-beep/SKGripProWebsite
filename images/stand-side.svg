<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ssTitle ssDesc">
  <title id="ssTitle">SK GRIP PRO 360° Magnetic Phone Stand - Side View</title>
  <desc id="ssDesc">Side view of a magnetic 360-degree phone stand with a silver circular magnetic head, rotating joint, adjustable hinge, matte black support arm and stable base with neon blue accents.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#020409"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="0.28" stop-color="#aeb7c4"/>
      <stop offset="0.52" stop-color="#5b6472"/>
      <stop offset="0.75" stop-color="#dbe2ec"/>
      <stop offset="1" stop-color="#7c8695"/>
    </linearGradient>

    <linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6372"/>
      <stop offset="0.22" stop-color="#f4f7fb"/>
      <stop offset="0.5" stop-color="#a3adbb"/>
      <stop offset="0.82" stop-color="#4a5361"/>
      <stop offset="1" stop-color="#1c2028"/>
    </linearGradient>

    <linearGradient id="baseWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5fa"/>
      <stop offset="0.35" stop-color="#a9b3c1"/>
      <stop offset="0.7" stop-color="#4a5361"/>
      <stop offset="1" stop-color="#1c2028"/>
    </linearGradient>

    <linearGradient id="matteH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="0.3" stop-color="#3a4352"/>
      <stop offset="0.6" stop-color="#14181f"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>

    <linearGradient id="matteV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303745"/>
      <stop offset="0.5" stop-color="#14181f"/>
      <stop offset="1" stop-color="#07090d"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff6ff"/>
      <stop offset="0.5" stop-color="#1aa8ff"/>
      <stop offset="1" stop-color="#0a5cff"/>
    </linearGradient>

    <linearGradient id="brandMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b4bdca"/>
      <stop offset="0.55" stop-color="#6d7787"/>
      <stop offset="1" stop-color="#d7dee8"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="260" rx="220" ry="195" fill="#1aa8ff" opacity="0.10" filter="url(#soft)"/>

  <!-- Brand -->
  <text x="256" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#metal)">SK GRIP PRO</text>
  <line x1="198" y1="68" x2="314" y2="68" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ground shadow and glow -->
  <ellipse cx="256" cy="448" rx="176" ry="18" fill="#000" opacity="0.75" filter="url(#shadow)"/>
  <ellipse cx="256" cy="442" rx="146" ry="11" fill="#1aa8ff" opacity="0.18" filter="url(#soft)"/>

  <!-- Base (side profile) -->
  <rect x="118" y="402" width="276" height="34" rx="14" fill="url(#baseWall)"/>
  <rect x="118" y="402" width="276" height="34" rx="14" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M132 406 Q136 403 160 403" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>
  <text x="256" y="424" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800" letter-spacing="5" fill="#12151b" opacity="0.85">SK GRIP PRO</text>
  <line x1="150" y1="431" x2="362" y2="431" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <rect x="128" y="386" width="256" height="20" rx="10" fill="url(#matteV)"/>
  <rect x="128" y="386" width="256" height="20" rx="10" fill="none" stroke="url(#metal)" stroke-width="2"/>
  <line x1="152" y1="396" x2="360" y2="396" stroke="url(#neon)" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Collar -->
  <rect x="232" y="376" width="48" height="16" rx="8" fill="url(#metalH)"/>
  <rect x="232" y="376" width="48" height="16" rx="8" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Lower support arm -->
  <rect x="242" y="318" width="28" height="64" rx="6" fill="url(#matteH)"/>
  <rect x="242" y="318" width="28" height="64" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="247" y1="338" x2="247" y2="374" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <text transform="translate(262 374) rotate(-90)" font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="800" letter-spacing="1.5" fill="#c7d0dc">SK GRIP</text>

  <!-- Adjustable upper section (tilted around the hinge) -->
  <g transform="rotate(-12 256 318)">
    <!-- Shadow of head -->
    <rect x="198" y="112" width="32" height="180" rx="16" fill="#000" opacity="0.5" filter="url(#shadow)"/>

    <!-- Upper arm -->
    <rect x="242" y="168" width="28" height="162" rx="10" fill="url(#matteH)"/>
    <rect x="242" y="168" width="28" height="162" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="247" y1="190" x2="247" y2="300" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="256" y1="214" x2="256" y2="298" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- 360 rotating joint -->
    <rect x="212" y="166" width="36" height="44" rx="9" fill="url(#metalH)"/>
    <rect x="212" y="166" width="36" height="44" rx="9" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
    <line x1="224" y1="170" x2="224" y2="206" stroke="#000" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="236" y1="170" x2="236" y2="206" stroke="#000" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="230" y1="171" x2="230" y2="205" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Magnetic head (edge-on) -->
    <rect x="186" y="100" width="32" height="180" rx="16" fill="url(#metalH)"/>
    <rect x="186" y="100" width="32" height="180" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="202" y1="108" x2="202" y2="272" stroke="#000" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="205" y1="112" x2="205" y2="268" stroke="url(#neon)" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="191" y1="122" x2="191" y2="258" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round"/>

    <!-- Magnetic plate (phone side) -->
    <rect x="178" y="110" width="10" height="160" rx="5" fill="url(#matteV)"/>
    <rect x="178" y="110" width="10" height="160" rx="5" fill="none" stroke="#c7d0dc" stroke-opacity="0.7" stroke-width="1.2"/>
    <line x1="178" y1="122" x2="178" y2="258" stroke="url(#neon)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <text transform="translate(212 244) rotate(-90)" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="800" letter-spacing="3" fill="#2a303a">SK GRIP PRO</text>
  </g>

  <!-- Adjustable hinge -->
  <circle cx="256" cy="324" r="22" fill="#000" opacity="0.45" filter="url(#shadow)"/>
  <circle cx="256" cy="318" r="22" fill="url(#metal)"/>
  <circle cx="256" cy="318" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
  <circle cx="256" cy="318" r="16" fill="url(#matteV)"/>
  <circle cx="256" cy="318" r="10" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="256" cy="318" r="3" fill="#8ff6ff"/>

  <!-- Angle adjustment arc -->
  <path d="M256 284 A34 34 0 0 0 226.6 301" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="222,304 233,301 227,295" fill="#6fe6ff" filter="url(#glow)"/>

  <!-- Sparkles -->
  <g fill="#8fe8ff" filter="url(#glow)">
    <circle cx="64" cy="150" r="1.8" opacity="0.8"/>
    <circle cx="452" cy="130" r="1.6" opacity="0.7"/>
    <circle cx="56" cy="330" r="1.4" opacity="0.6"/>
    <circle cx="460" cy="300" r="1.6" opacity="0.7"/>
    <circle cx="400" cy="96" r="1.3" opacity="0.6"/>
  </g>

  <!-- Tagline -->
  <text x="256" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#8fa6c4">360° MAGNETIC STAND · SIDE VIEW</text>
</svg>
