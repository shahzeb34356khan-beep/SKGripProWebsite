<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sfTitle sfDesc">
  <title id="sfTitle">SK GRIP PRO Magnetic 360 Stand - Front View</title>
  <desc id="sfDesc">Front view of a magnetic 360-degree phone stand with a large circular magnetic head, SK branding, an adjustable arm with a hinge and a stable silver base with neon blue accents.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#020409"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="0.28" stop-color="#aeb7c4"/>
      <stop offset="0.52" stop-color="#5b6472"/>
      <stop offset="0.75" stop-color="#dbe2ec"/>
      <stop offset="1" stop-color="#7c8695"/>
    </linearGradient>

    <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6372"/>
      <stop offset="0.2" stop-color="#f1f5fa"/>
      <stop offset="0.5" stop-color="#a3adbb"/>
      <stop offset="0.8" stop-color="#4a5361"/>
      <stop offset="1" stop-color="#1c2028"/>
    </linearGradient>

    <linearGradient id="baseSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5361"/>
      <stop offset="0.18" stop-color="#e3e9f1"/>
      <stop offset="0.45" stop-color="#8b95a4"/>
      <stop offset="0.78" stop-color="#2b313b"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>

    <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8edf4"/>
      <stop offset="0.35" stop-color="#9aa4b2"/>
      <stop offset="0.7" stop-color="#4a5361"/>
      <stop offset="1" stop-color="#b6bfcc"/>
    </linearGradient>

    <radialGradient id="matte" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#2f3644"/>
      <stop offset="0.55" stop-color="#13171e"/>
      <stop offset="1" stop-color="#06080c"/>
    </radialGradient>

    <radialGradient id="disc" cx="40%" cy="32%" r="85%">
      <stop offset="0" stop-color="#262d3a"/>
      <stop offset="0.6" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#040508"/>
    </radialGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff6ff"/>
      <stop offset="0.5" stop-color="#1aa8ff"/>
      <stop offset="1" stop-color="#0a5cff"/>
    </linearGradient>

    <linearGradient id="brandMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b4bdca"/>
      <stop offset="0.55" stop-color="#6d7787"/>
      <stop offset="1" stop-color="#d7dee8"/>
    </linearGradient>

    <linearGradient id="brandDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5361"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="260" rx="220" ry="195" fill="#1aa8ff" opacity="0.10" filter="url(#soft)"/>

  <!-- Brand -->
  <text x="256" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#metal)">SK GRIP PRO</text>
  <line x1="198" y1="68" x2="314" y2="68" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ground shadow and glow -->
  <ellipse cx="256" cy="448" rx="190" ry="20" fill="#000" opacity="0.75" filter="url(#shadow)"/>
  <ellipse cx="256" cy="442" rx="150" ry="12" fill="#1aa8ff" opacity="0.18" filter="url(#soft)"/>

  <!-- Base: front wall -->
  <rect x="96" y="404" width="320" height="34" rx="14" fill="url(#baseSide)"/>
  <rect x="96" y="404" width="320" height="34" rx="14" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="150" y1="431" x2="362" y2="431" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Base: top face (silver) -->
  <rect x="104" y="384" width="304" height="40" rx="18" fill="url(#baseTop)"/>
  <rect x="104" y="384" width="304" height="40" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="120" y="391" width="272" height="26" rx="12" fill="url(#matte)"/>
  <rect x="120" y="391" width="272" height="26" rx="12" fill="none" stroke="#1aa8ff" stroke-opacity="0.45" stroke-width="1.2"/>
  <path d="M114 391 Q118 387 142 387" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>

  <!-- Base branding -->
  <text transform="translate(256 411) scale(1 0.55)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="6" fill="url(#brandMetal)">SK GRIP PRO</text>
  <line x1="196" y1="414" x2="316" y2="414" stroke="url(#neon)" stroke-width="1.6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Support arm -->
  <ellipse cx="256" cy="392" rx="32" ry="8" fill="#000" opacity="0.55" filter="url(#shadow)"/>
  <rect x="240" y="322" width="32" height="68" fill="url(#metalV)"/>
  <rect x="240" y="322" width="32" height="68" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="249" y="332" width="14" height="48" rx="7" fill="#0a0c11"/>
  <line x1="256" y1="340" x2="256" y2="372" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <ellipse cx="256" cy="387" rx="30" ry="8" fill="url(#matte)" stroke="url(#metal)" stroke-width="1.5"/>

  <!-- Magnetic head: shadow and thickness -->
  <circle cx="256" cy="216" r="108" fill="#000" opacity="0.6" filter="url(#shadow)"/>
  <circle cx="256" cy="206" r="108" fill="#1a1e26"/>

  <!-- Outer silver aluminum ring -->
  <circle cx="256" cy="198" r="108" fill="url(#metal)"/>
  <circle cx="256" cy="198" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="256" cy="198" r="99" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Magnetic ring (clearly visible) -->
  <circle cx="256" cy="198" r="94" fill="url(#matte)"/>
  <circle cx="256" cy="198" r="94" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="256" cy="198" r="86" fill="none" stroke="#c7d0dc" stroke-opacity="0.85" stroke-width="10"/>
  <circle cx="256" cy="198" r="86" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="10" stroke-dasharray="1 7"/>
  <circle cx="256" cy="198" r="91" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="256" cy="198" r="81" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Neon ring -->
  <circle cx="256" cy="198" r="74" fill="none" stroke="#1aa8ff" stroke-width="9" opacity="0.45" filter="url(#soft)"/>
  <circle cx="256" cy="198" r="74" fill="none" stroke="url(#neon)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Centre disc with SK branding -->
  <circle cx="256" cy="206" r="62" fill="#05070b" opacity="0.7" filter="url(#shadow)"/>
  <circle cx="256" cy="198" r="62" fill="url(#metal)"/>
  <circle cx="256" cy="198" r="57" fill="url(#disc)"/>
  <circle cx="256" cy="198" r="57" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
  <circle cx="256" cy="198" r="49" fill="none" stroke="url(#neon)" stroke-width="1.8" opacity="0.85" filter="url(#glow)"/>
  <text x="256" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="2" fill="url(#brandMetal)">SK</text>
  <line x1="222" y1="224" x2="290" y2="224" stroke="url(#neon)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <text x="256" y="239" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="800" letter-spacing="4" fill="url(#brandMetal)">GRIP PRO</text>

  <!-- Highlights -->
  <path d="M177.9 132.4 A102 102 0 0 1 229.6 99.5" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
  <path d="M200 140 A70 70 0 0 1 236 128" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

  <!-- Hinge barrel -->
  <rect x="206" y="298" width="100" height="30" rx="15" fill="#000" opacity="0.45" filter="url(#shadow)" transform="translate(0 6)"/>
  <rect x="206" y="298" width="100" height="30" rx="15" fill="url(#metalV)"/>
  <rect x="206" y="298" width="100" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2"/>
  <rect x="226" y="306" width="60" height="14" rx="7" fill="url(#matte)"/>
  <line x1="236" y1="313" x2="276" y2="313" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="222" cy="313" r="9" fill="url(#metal)"/>
  <circle cx="222" cy="313" r="5.5" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="290" cy="313" r="9" fill="url(#metal)"/>
  <circle cx="290" cy="313" r="5.5" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>

  <!-- Sparkles -->
  <g fill="#8fe8ff" filter="url(#glow)">
    <circle cx="64" cy="150" r="1.8" opacity="0.8"/>
    <circle cx="452" cy="130" r="1.6" opacity="0.7"/>
    <circle cx="56" cy="320" r="1.4" opacity="0.6"/>
    <circle cx="460" cy="300" r="1.6" opacity="0.7"/>
    <circle cx="410" cy="96" r="1.3" opacity="0.6"/>
  </g>

  <!-- Tagline -->
  <text x="256" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#8fa6c4">360° MAGNETIC STAND · FRONT VIEW</text>
</svg>
