
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset=".35" stop-color="#8b98a8"/>
      <stop offset=".65" stop-color="#e4eaf2"/>
      <stop offset="1" stop-color="#536174"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#075bff"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="35" fill="#080d18"/>
  <ellipse cx="256" cy="438" rx="125" ry="18" fill="#000" opacity=".6" filter="url(#shadow)"/>

  <!-- Magnetic circular head -->
  <circle cx="256" cy="150" r="112" fill="#111c2d" stroke="url(#metal)" stroke-width="17"/>
  <circle cx="256" cy="150" r="91" fill="#101b2b" stroke="url(#blue)" stroke-width="5"/>
  <circle cx="256" cy="150" r="73" fill="none" stroke="#8395ad" stroke-width="3" opacity=".65"/>
  <circle cx="256" cy="150" r="58" fill="#17283d" stroke="#dce8f7" stroke-width="2"/>
  <circle cx="256" cy="150" r="37" fill="#0a1424" stroke="url(#blue)" stroke-width="4"/>
  <text x="256" y="158" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="#eaf7ff">SK</text>

  <!-- Stand neck -->
  <path d="M225 258 L287 258 L300 365 L212 365 Z"
        fill="url(#metal)" stroke="#b9c8da" stroke-width="3"/>
  <path d="M248 270 L264 270 L271 350 L241 350 Z"
        fill="#17283d"/>

  <!-- Base -->
  <path d="M170 374 Q256 348 342 374 L378 416 Q385 431 365 436 L147 436 Q127 431 134 416 Z"
        fill="url(#metal)" stroke="#e0eaff" stroke-width="3"/>
  <path d="M158 405 Q256 386 354 405" fill="none" stroke="url(#blue)" stroke-width="5"/>
  <text x="256" y="425" text-anchor="middle" font-family="Arial"
        font-size="16" font-weight="bold" letter-spacing="3" fill="#101b2b">SK GRIP PRO</text>
</svg>
