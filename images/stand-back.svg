
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset=".45" stop-color="#8291a5"/>
      <stop offset="1" stop-color="#e1e9f4"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#075bff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="35" fill="#080d18"/>

  <!-- Back of magnetic head -->
  <circle cx="256" cy="150" r="112" fill="url(#silver)"
          stroke="#e4edfa" stroke-width="5"/>
  <circle cx="256" cy="150" r="94" fill="#17283d"
          stroke="url(#blue)" stroke-width="6"/>
  <circle cx="256" cy="150" r="76" fill="#0c1728"
          stroke="#aebdd0" stroke-width="3"/>
  <circle cx="256" cy="150" r="53" fill="none"
          stroke="#8b9bb0" stroke-width="5"/>
  <circle cx="256" cy="150" r="31" fill="#17283d"
          stroke="url(#silver)" stroke-width="5"/>
  <circle cx="256" cy="150" r="12" fill="url(#blue)"/>

  <!-- Hinge -->
  <rect x="224" y="248" width="64" height="45" rx="13"
        fill="url(#silver)" stroke="#dce8f7" stroke-width="3"/>
  <circle cx="256" cy="270" r="12" fill="#101b2b"
          stroke="url(#blue)" stroke-width="4"/>

  <!-- Support -->
  <path d="M225 285 L287 285 L303 375 L209 375 Z"
        fill="url(#silver)" stroke="#dce8f7" stroke-width="3"/>
  <path d="M245 299 L267 299 L278 354 L234 354 Z"
        fill="#17283d"/>

  <!-- Base -->
  <path d="M155 374 Q256 350 357 374 L381 414
           Q388 434 363 438 L149 438 Q124 434 131 414 Z"
        fill="url(#silver)" stroke="#e4edfa" stroke-width="3"/>
  <path d="M155 405 Q256 386 357 405"
        fill="none" stroke="url(#blue)" stroke-width="5"/>
  <text x="256" y="426" text-anchor="middle"
        font-family="Arial" font-size="16" font-weight="bold"
        letter-spacing="3" fill="#101b2b">SK GRIP PRO</text>
</svg>
