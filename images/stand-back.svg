<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="sbTitle sbDesc">
  <title id="sbTitle">SK GRIP PRO Magnetic 360 Stand - Back View</title>
  <desc id="sbDesc">Back view of a magnetic 360-degree phone stand with a large circular metal mounting plate, rotation mechanism, hinge, support arm and stable base with neon blue accents.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#020409"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="0.28" stop-color="#aeb7c4"/>
      <stop offset="0.52" stop-color="#5b6472"/>
      <stop offset="0.75" stop-color="#dbe2ec"/>
      <stop offset="1" stop-color="#7c8695"/>
    </linearGradient>

    <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5361"/>
      <stop offset="0.2" stop-color="#d9e0ea"/>
      <stop offset="0.5" stop-color="#8b95a4"/>
      <stop offset="0.8" stop-color="#2b313b"/>
      <stop offset="1" stop-color="#14181f"/>
    </linearGradient>

    <radialGradient id="matte" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#2f3644"/>
      <stop offset="0.55" stop-color="#13171e"/>
      <stop offset="1" stop-color="#06080c"/>
    </radialGradient>

    <radialGradient id="disc" cx="40%" cy="32%" r="85%">
      <stop offset="0" stop-color="#262d3a"/>
      <stop offset="0.6" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#040508"/>
    </radialGradient>

    <linearGradient id="baseTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303745"/>
      <stop offset="0.55" stop-color="#12161d"/>
      <stop offset="1" stop-color="#06080c"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff6ff"/>
      <stop offset="0.5" stop-color="#1aa8ff"/>
      <stop offset="1" stop-color="#0a5cff"/>
    </linearGradient>

    <linearGradient id="brandMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b4bdca"/>
      <stop offset="0.55" stop-color="#6d7787"/>
      <stop offset="1" stop-color="#d7dee8"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="260" rx="220" ry="195" fill="#1aa8ff" opacity="0.10" filter="url(#soft)"/>

  <!-- Brand -->
  <text x="256" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#metal)">SK GRIP PRO</text>
  <line x1="198" y1="68" x2="314" y2="68" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ground shadow and glow -->
  <ellipse cx="256" cy="448" rx="190" ry="20" fill="#000" opacity="0.75" filter="url(#shadow)"/>
  <ellipse cx="256" cy="442" rx="150" ry="12" fill="#1aa8ff" opacity="0.18" filter="url(#soft)"/>

  <!-- Base: front wall -->
  <rect x="96" y="404" width="320" height="34" rx="14" fill="url(#metalV)"/>
  <rect x="96" y="404" width="320" height="34" rx="14" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="150" y1="431" x2="362" y2="431" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Base: top face -->
  <rect x="104" y="384" width="304" height="40" rx="18" fill="url(#baseTop)"/>
  <rect x="104" y="384" width="304" height="40" rx="18" fill="none" stroke="url(#metal)" stroke-width="2.5"/>
  <path d="M118 391 Q122 387 146 387" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <text transform="translate(256 412) scale(1 0.5)" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="6" fill="url(#brandMetal)">SK GRIP PRO</text>

  <!-- Support arm -->
  <ellipse cx="256" cy="392" rx="30" ry="8" fill="#000" opacity="0.55" filter="url(#shadow)"/>
  <rect x="240" y="322" width="32" height="68" fill="url(#metalV)"/>
  <rect x="240" y="322" width="32" height="68" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="249" y="332" width="14" height="48" rx="7" fill="#0a0c11"/>
  <line x1="256" y1="340" x2="256" y2="372" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <ellipse cx="256" cy="387" rx="30" ry="8" fill="url(#matte)" stroke="url(#metal)" stroke-width="1.5"/>

  <!-- Mounting plate: shadow and thickness -->
  <circle cx="256" cy="216" r="108" fill="#000" opacity="0.6" filter="url(#shadow)"/>
  <circle cx="256" cy="206" r="108" fill="#161a21"/>

  <!-- Outer silver ring -->
  <circle cx="256" cy="198" r="108" fill="url(#metal)"/>
  <circle cx="256" cy="198" r="108" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="256" cy="198" r="100" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Matte black magnetic plate -->
  <circle cx="256" cy="198" r="96" fill="url(#matte)"/>
  <circle cx="256" cy="198" r="96" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Neon ring -->
  <circle cx="256" cy="198" r="90" fill="none" stroke="#1aa8ff" stroke-width="9" opacity="0.45" filter="url(#soft)"/>
  <circle cx="256" cy="198" r="90" fill="none" stroke="url(#neon)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- 360 rotation arrows -->
  <g fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <path d="M186.7 158 A80 80 0 0 1 228.6 122.8"/>
    <path d="M325.3 238 A80 80 0 0 1 283.4 273.2"/>
  </g>
  <g fill="#6fe6ff" filter="url(#glow)">
    <polygon points="236.1,120.1 230.3,127.5 226.9,118.1"/>
    <polygon points="275.9,275.9 281.7,268.5 285.1,277.9"/>
  </g>

  <!-- Rotation mechanism ticks -->
  <circle cx="256" cy="198" r="68" fill="none" stroke="#8fa0b5" stroke-opacity="0.55" stroke-width="6" stroke-dasharray="2 8"/>
  <circle cx="256" cy="198" r="62" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="2"/>

  <!-- Center rotating disc -->
  <circle cx="256" cy="208" r="58" fill="#05070b" opacity="0.7" filter="url(#shadow)"/>
  <circle cx="256" cy="198" r="58" fill="url(#metal)"/>
  <circle cx="256" cy="198" r="53" fill="url(#disc)"/>
  <circle cx="256" cy="198" r="53" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
  <circle cx="256" cy="198" r="45" fill="none" stroke="url(#neon)" stroke-width="1.8" opacity="0.85" filter="url(#glow)"/>

  <!-- Back branding -->
  <text x="256" y="207" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="2" fill="url(#brandMetal)">SK</text>
  <line x1="226" y1="214" x2="286" y2="214" stroke="url(#neon)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>
  <text x="256" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="800" letter-spacing="4" fill="url(#brandMetal)">GRIP PRO</text>

  <!-- Plate highlights -->
  <path d="M177.9 132.4 A102 102 0 0 1 229.6 99.5" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  <path d="M208 150 A64 64 0 0 1 244 138" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

  <!-- Hinge barrel -->
  <rect x="206" y="298" width="100" height="30" rx="15" fill="#000" opacity="0.45" filter="url(#shadow)" transform="translate(0 6)"/>
  <rect x="206" y="298" width="100" height="30" rx="15" fill="url(#metalV)"/>
  <rect x="206" y="298" width="100" height="30" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"/>
  <rect x="226" y="306" width="60" height="14" rx="7" fill="url(#matte)"/>
  <line x1="236" y1="313" x2="276" y2="313" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="222" cy="313" r="9" fill="url(#metal)"/>
  <circle cx="222" cy="313" r="5.5" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="290" cy="313" r="9" fill="url(#metal)"/>
  <circle cx="290" cy="313" r="5.5" fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>

  <!-- Sparkles -->
  <g fill="#8fe8ff" filter="url(#glow)">
    <circle cx="64" cy="150" r="1.8" opacity="0.8"/>
    <circle cx="452" cy="130" r="1.6" opacity="0.7"/>
    <circle cx="56" cy="320" r="1.4" opacity="0.6"/>
    <circle cx="460" cy="300" r="1.6" opacity="0.7"/>
    <circle cx="410" cy="96" r="1.3" opacity="0.6"/>
  </g>

  <!-- Tagline -->
  <text x="256" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#8fa6c4">360° MAGNETIC STAND · BACK VIEW</text>
</svg>
