
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset=".5" stop-color="#8291a5"/>
      <stop offset="1" stop-color="#e3eaf5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#075bff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="35" fill="#080d18"/>

  <!-- Premium accessory collection -->
  <rect x="105" y="115" width="125" height="185" rx="22"
        fill="#17283d" stroke="url(#silver)" stroke-width="9"/>
  <rect x="125" y="135" width="85" height="145" rx="14"
        fill="#0a1424" stroke="url(#blue)" stroke-width="4"/>
  <circle cx="168" cy="207" r="28" fill="none"
          stroke="url(#silver)" stroke-width="7"/>
  <circle cx="168" cy="207" r="12" fill="#00d9ff"/>

  <!-- Cable -->
  <path d="M285 135 C385 135 385 230 285 230
           C230 230 230 315 315 315"
        fill="none" stroke="url(#silver)" stroke-width="18"
        stroke-linecap="round"/>
  <path d="M285 135 C385 135 385 230 285 230"
        fill="none" stroke="url(#blue)" stroke-width="5"/>
  <rect x="270" y="117" width="32" height="28" rx="7"
        fill="url(#silver)"/>
  <rect x="305" y="299" width="35" height="32" rx="7"
        fill="url(#silver)"/>

  <!-- Small accessory -->
  <circle cx="360" cy="365" r="45" fill="#17283d"
          stroke="url(#silver)" stroke-width="9"/>
  <circle cx="360" cy="365" r="25" fill="none"
          stroke="url(#blue)" stroke-width="6"/>

  <text x="256" y="435" text-anchor="middle"
        font-family="Arial" font-size="20" font-weight="bold"
        letter-spacing="3" fill="#eaf7ff">SK GRIP PRO</text>
  <text x="256" y="461" text-anchor="middle"
        font-family="Arial" font-size="12"
