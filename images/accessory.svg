<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="skTitle skDesc">
  <title id="skTitle">SK GRIP PRO Mobile Accessories</title>
  <desc id="skDesc">A metallic magnetic ring, a phone grip and a USB-C cable with neon blue highlights on a dark background.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#020409"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="0.28" stop-color="#aeb7c4"/>
      <stop offset="0.52" stop-color="#5b6472"/>
      <stop offset="0.75" stop-color="#dbe2ec"/>
      <stop offset="1" stop-color="#7c8695"/>
    </linearGradient>

    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b424e"/>
      <stop offset="0.5" stop-color="#171b22"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff6ff"/>
      <stop offset="0.5" stop-color="#1aa8ff"/>
      <stop offset="1" stop-color="#0a5cff"/>
    </linearGradient>

    <linearGradient id="cableG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1f28"/>
      <stop offset="0.5" stop-color="#454e5c"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>

    <radialGradient id="hole" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset="1" stop-color="#010204"/>
    </radialGradient>

    <radialGradient id="padG" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2a3140"/>
      <stop offset="1" stop-color="#07090d"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="250" rx="230" ry="150" fill="#1aa8ff" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="256" cy="452" rx="215" ry="26" fill="#1aa8ff" opacity="0.10" filter="url(#soft)"/>

  <!-- Brand -->
  <text x="256" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="8" fill="url(#metal)">SK GRIP PRO</text>
  <line x1="196" y1="80" x2="316" y2="80" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Magnetic ring -->
  <ellipse cx="170" cy="338" rx="92" ry="12" fill="#000" opacity="0.6" filter="url(#shadow)"/>
  <circle cx="170" cy="252" r="92" fill="#1b2029"/>
  <circle cx="170" cy="245" r="92" fill="url(#metal)"/>
  <circle cx="170" cy="245" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="170" cy="245" r="78" fill="url(#metalDark)"/>
  <circle cx="170" cy="245" r="72" fill="none" stroke="#8fa0b5" stroke-opacity="0.6" stroke-width="4" stroke-dasharray="6 14"/>
  <circle cx="170" cy="245" r="62" fill="none" stroke="url(#neon)" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="170" cy="245" r="50" fill="url(#hole)"/>
  <circle cx="170" cy="245" r="50" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="3"/>
  <path d="M 100 205 A 84 84 0 0 1 160 163" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  <text x="170" y="251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="url(#neon)" filter="url(#glow)">SK</text>

  <!-- Phone grip -->
  <ellipse cx="372" cy="292" rx="62" ry="9" fill="#000" opacity="0.6" filter="url(#shadow)"/>
  <circle cx="372" cy="227" r="64" fill="#1b2029"/>
  <circle cx="372" cy="220" r="64" fill="url(#metal)"/>
  <circle cx="372" cy="220" r="64" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="372" cy="220" r="52" fill="url(#padG)"/>
  <circle cx="372" cy="220" r="40" fill="none" stroke="url(#neon)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="372" y="231" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="url(#neon)" filter="url(#glow)">SK</text>
  <path d="M 328 190 A 50 50 0 0 1 362 170" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- USB-C cable -->
  <path d="M -10 410 C 70 350, 150 470, 235 415 S 330 365, 392 402" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round" opacity="0.55" filter="url(#shadow)" transform="translate(0 14)"/>
  <path d="M -10 410 C 70 350, 150 470, 235 415 S 330 365, 392 402" fill="none" stroke="#0a0c11" stroke-width="16" stroke-linecap="round"/>
  <path d="M -10 410 C 70 350, 150 470, 235 415 S 330 365, 392 402" fill="none" stroke="url(#cableG)" stroke-width="12" stroke-linecap="round"/>
  <path d="M -10 410 C 70 350, 150 470, 235 415 S 330 365, 392 402" fill="none" stroke="#9aa7ba" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" transform="translate(-1 -3)"/>
  <path d="M -10 410 C 70 350, 150 470, 235 415 S 330 365, 392 402" fill="none" stroke="url(#neon)" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 12" transform="translate(0 3)"/>

  <!-- USB-C connector -->
  <rect x="386" y="388" width="24" height="26" rx="7" fill="url(#metalDark)"/>
  <rect x="406" y="383" width="62" height="34" rx="10" fill="url(#metal)"/>
  <rect x="406" y="383" width="62" height="34" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.2"/>
  <rect x="414" y="398" width="40" height="3.5" rx="1.75" fill="url(#neon)" filter="url(#glow)"/>
  <rect x="462" y="389" width="30" height="22" rx="11" fill="url(#metalDark)" stroke="#c4ccd8" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="469" y="396" width="17" height="8" rx="4" fill="#010204"/>
  <rect x="472" y="399" width="11" height="2" rx="1" fill="#1aa8ff" opacity="0.8"/>

  <!-- Sparkles -->
  <g fill="#8ff6ff" filter="url(#glow)">
    <circle cx="70" cy="140" r="1.8" opacity="0.8"/>
    <circle cx="448" cy="120" r="1.6" opacity="0.7"/>
    <circle cx="300" cy="140" r="1.3" opacity="0.6"/>
    <circle cx="470" cy="320" r="1.6" opacity="0.7"/>
    <circle cx="40" cy="330" r="1.4" opacity="0.6"/>
  </g>

  <!-- Tagline -->
  <text x="256" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#8fa6c4">PREMIUM MOBILE ACCESSORIES</text>
</svg>
