
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset=".5" stop-color="#8291a5"/>
      <stop offset="1" stop-color="#e3eaf5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#075bff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="35" fill="#080d18"/>

  <!-- Magnetic phone grip -->
  <circle cx="256" cy="230" r="145" fill="#111d30"
          stroke="url(#silver)" stroke-width="15"/>
  <circle cx="256" cy="230" r="120" fill="#17283d"
          stroke="url(#blue)" stroke-width="6"/>
  <circle cx="256" cy="230" r="91" fill="#0a1424"
          stroke="#9eacc0" stroke-width="5"/>
  <circle cx="256" cy="230" r="67" fill="none"
          stroke="url(#silver)" stroke-width="9"/>
  <circle cx="256" cy="230" r="48" fill="#14243a"
          stroke="url(#blue)" stroke-width="5"/>

  <!-- Brand -->
  <text x="256" y="240" text-anchor="middle"
        font-family="Arial" font-size="30" font-weight="bold"
        fill="#eaf7ff">SK</text>
  <text x="256" y="280" text-anchor="middle"
        font-family="Arial" font-size="12" font-weight="bold"
        letter-spacing="3" fill="#00d9ff">GRIP PRO</text>

  <!-- Metallic edge details -->
  <path d="M145 135 Q256 65 367 135" fill="none"
        stroke="#f5f8ff" stroke-width="5" opacity=".7"/>
  <path d="M145 325 Q256 395 367 325" fill="none"
        stroke="#00bfff" stroke-width="5" opacity=".8"/>

  <text x="256" y="440" text-anchor="middle"
        font-family="Arial" font-size="18" font-weight="bold"
        letter-spacing="4" fill="#eaf7ff">360° MAGNETIC GRIP</text>
</svg>
