<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="gTitle gDesc">
  <title id="gTitle">SK GRIP PRO Magnetic Phone Grip</title>
  <desc id="gDesc">A premium magnetic phone grip with a silver ring, matte black aluminum body, 360-degree rotation detail and neon blue glowing accents.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="0.6" stop-color="#070b14"/>
      <stop offset="1" stop-color="#020409"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f9fd"/>
      <stop offset="0.28" stop-color="#aeb7c4"/>
      <stop offset="0.52" stop-color="#5b6472"/>
      <stop offset="0.75" stop-color="#dbe2ec"/>
      <stop offset="1" stop-color="#7c8695"/>
    </linearGradient>

    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d4452"/>
      <stop offset="0.18" stop-color="#d9e0ea"/>
      <stop offset="0.42" stop-color="#8b95a4"/>
      <stop offset="0.75" stop-color="#2b313b"/>
      <stop offset="1" stop-color="#0f1217"/>
    </linearGradient>

    <radialGradient id="matte" cx="38%" cy="32%" r="85%">
      <stop offset="0" stop-color="#2d3441"/>
      <stop offset="0.55" stop-color="#12161d"/>
      <stop offset="1" stop-color="#06080c"/>
    </radialGradient>

    <radialGradient id="disc" cx="40%" cy="32%" r="85%">
      <stop offset="0" stop-color="#232a36"/>
      <stop offset="0.6" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#040508"/>
    </radialGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ff6ff"/>
      <stop offset="0.5" stop-color="#1aa8ff"/>
      <stop offset="1" stop-color="#0a5cff"/>
    </linearGradient>

    <linearGradient id="brandMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b4bdca"/>
      <stop offset="0.55" stop-color="#6d7787"/>
      <stop offset="1" stop-color="#d7dee8"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="260" rx="225" ry="190" fill="#1aa8ff" opacity="0.10" filter="url(#soft)"/>

  <!-- Brand -->
  <text x="256" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8" fill="url(#metal)">SK GRIP PRO</text>
  <line x1="198" y1="68" x2="314" y2="68" stroke="url(#neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Ground shadow and glow -->
  <ellipse cx="256" cy="414" rx="160" ry="24" fill="#000" opacity="0.7" filter="url(#shadow)"/>
  <ellipse cx="256" cy="404" rx="140" ry="18" fill="#1aa8ff" opacity="0.20" filter="url(#soft)"/>

  <!-- Grip thickness (side wall) -->
  <path d="M106 250 V274 A150 134 0 0 0 406 274 V250 Z" fill="url(#side)"/>
  <path d="M106 274 A150 134 0 0 0 406 274" fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Outer silver magnetic ring -->
  <ellipse cx="256" cy="250" rx="150" ry="134" fill="url(#metal)"/>
  <ellipse cx="256" cy="250" rx="150" ry="134" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
  <ellipse cx="256" cy="250" rx="141" ry="126" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Matte black aluminum body -->
  <ellipse cx="256" cy="250" rx="136" ry="121" fill="url(#matte)"/>
  <ellipse cx="256" cy="250" rx="136" ry="121" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Neon glowing circular accent -->
  <ellipse cx="256" cy="250" rx="124" ry="110" fill="none" stroke="#1aa8ff" stroke-width="9" opacity="0.45" filter="url(#soft)"/>
  <ellipse cx="256" cy="250" rx="124" ry="110" fill="none" stroke="url(#neon)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Rotating mechanism detail: ticks -->
  <ellipse cx="256" cy="250" rx="112" ry="100" fill="none" stroke="#8fa0b5" stroke-opacity="0.55" stroke-width="7" stroke-dasharray="2 9"/>
  <ellipse cx="256" cy="250" rx="104" ry="93" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="2"/>

  <!-- 360 rotation arrows -->
  <g fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <path d="M150.7 215.8 A112 100 0 0 1 217.7 156"/>
    <path d="M361.3 284.2 A112 100 0 0 1 294.3 344"/>
  </g>
  <g fill="#6fe6ff" filter="url(#glow)">
    <polygon points="226,153.5 219.2,160.8 216.2,151.2"/>
    <polygon points="286.7,346.5 295.8,348.8 292.8,339.2"/>
  </g>

  <!-- Center disc -->
  <ellipse cx="256" cy="262" rx="88" ry="78" fill="#05070b" opacity="0.7" filter="url(#shadow)"/>
  <ellipse cx="256" cy="250" rx="88" ry="78" fill="url(#metal)"/>
  <ellipse cx="256" cy="250" rx="82" ry="72" fill="url(#disc)"/>
  <ellipse cx="256" cy="250" rx="82" ry="72" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
  <ellipse cx="256" cy="250" rx="72" ry="63" fill="none" stroke="url(#neon)" stroke-width="1.8" opacity="0.8" filter="url(#glow)"/>

  <!-- Branding -->
  <text x="256" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="3" fill="url(#brandMetal)">SK</text>
  <line x1="212" y1="272" x2="300" y2="272" stroke="url(#neon)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
  <text x="256" y="292" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" letter-spacing="5" fill="url(#brandMetal)">GRIP PRO</text>

  <!-- Highlights -->
  <path d="M130 196 A140 124 0 0 1 206 142" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
  <path d="M232 192 A80 70 0 0 1 276 188" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>

  <!-- Neon accent dots on the rim -->
  <g fill="#8ff6ff" filter="url(#glow)">
    <circle cx="256" cy="140" r="2.6"/>
    <circle cx="256" cy="360" r="2.6"/>
    <circle cx="146" cy="250" r="2.6"/>
    <circle cx="366" cy="250" r="2.6"/>
  </g>

  <!-- Sparkles -->
  <g fill="#8fe8ff" filter="url(#glow)">
    <circle cx="72" cy="150" r="1.8" opacity="0.8"/>
    <circle cx="446" cy="130" r="1.6" opacity="0.7"/>
    <circle cx="60" cy="330" r="1.4" opacity="0.6"/>
    <circle cx="456" cy="340" r="1.6" opacity="0.7"/>
    <circle cx="400" cy="90" r="1.3" opacity="0.6"/>
  </g>

  <!-- Tagline -->
  <text x="256" y="486" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="5" fill="#8fa6c4">360° ROTATING MAGNETIC GRIP</text>
</svg>
