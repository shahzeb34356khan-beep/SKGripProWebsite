
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset=".5" stop-color="#8493a7"/>
      <stop offset="1" stop-color="#e3eaf5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#075bff"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="35" fill="#080d18"/>

  <!-- Wireless charging pad -->
  <ellipse cx="256" cy="280" rx="155" ry="105"
           fill="#111d30" stroke="url(#silver)" stroke-width="12"/>
  <ellipse cx="256" cy="268" rx="130" ry="83"
           fill="#17283d" stroke="url(#blue)" stroke-width="5"/>
  <ellipse cx="256" cy="260" rx="90" ry="55"
           fill="#0a1424" stroke="#aebdd0" stroke-width="4"/>

  <!-- Wireless charging symbol -->
  <path d="M205 240 Q256 185 307 240"
        fill="none" stroke="url(#blue)" stroke-width="10"
        stroke-linecap="round"/>
  <path d="M225 260 Q256 228 287 260"
        fill="none" stroke="url(#silver)" stroke-width="9"
        stroke-linecap="round"/>
  <circle cx="256" cy="275" r="9" fill="#00e5ff"/>

  <!-- Power indicator -->
  <circle cx="256" cy="355" r="7" fill="#00e5ff"/>

  <text x="256" y="430" text-anchor="middle"
        font-family="Arial" font-size="19" font-weight="bold"
        letter-spacing="3" fill="#eaf7ff">SK GRIP PRO</text>
  <text x="256" y="457" text-anchor="middle"
        font-family="Arial" font-size="12"
        letter-spacing="3" fill="#00d9ff">WIRELESS CHARGING</text>
</svg>
