<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600" height="600" viewBox="0 0 600 600">
  <title>SK GRIP PRO</title>
  <desc>Premium luxury logo with metallic silver SK lettering and GRIP PRO beneath it on a black background.</desc>

  <defs>
    <!-- Background spotlight -->
    <radialGradient id="spot" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#2a2a2e"/>
      <stop offset="0.55" stop-color="#101012"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>

    <!-- Metallic silver for the main letters (user space so it works on strokes) -->
    <linearGradient id="silverMain" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="350">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.28" stop-color="#d9dce1"/>
      <stop offset="0.5" stop-color="#8b8f96"/>
      <stop offset="0.54" stop-color="#b9bcc2"/>
      <stop offset="0.8" stop-color="#e8eaed"/>
      <stop offset="1" stop-color="#9ea2a9"/>
    </linearGradient>

    <!-- Metallic silver for the smaller text -->
    <linearGradient id="silverText" gradientUnits="userSpaceOnUse" x1="0" y1="392" x2="0" y2="426">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#b9bcc2"/>
      <stop offset="0.55" stop-color="#7d8087"/>
      <stop offset="1" stop-color="#e1e3e7"/>
    </linearGradient>

    <!-- Frame gradient -->
    <linearGradient id="silverFrame" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="570" y2="570">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#8b8f96"/>
      <stop offset="0.65" stop-color="#d9dce1"/>
      <stop offset="1" stop-color="#6f7278"/>
    </linearGradient>

    <!-- Divider line gradient -->
    <linearGradient id="silverLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ccd1" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#c9ccd1"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#c9ccd1"/>
      <stop offset="1" stop-color="#c9ccd1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="600" fill="#000000"/>
  <rect x="0" y="0" width="600" height="600" fill="url(#spot)"/>

  <!-- Elegant double frame -->
  <rect x="26" y="26" width="548" height="548" rx="6" ry="6" fill="none" stroke="url(#silverFrame)" stroke-width="3"/>
  <rect x="40" y="40" width="520" height="520" rx="3" ry="3" fill="none" stroke="#c9ccd1" stroke-width="1" stroke-opacity="0.28"/>

  <!-- Corner accents -->
  <g fill="none" stroke="#c9ccd1" stroke-width="3.5" stroke-linecap="square">
    <path d="M26 72 V26 H72"/>
    <path d="M528 26 H574 V72"/>
    <path d="M574 528 V574 H528"/>
    <path d="M72 574 H26 V528"/>
  </g>

  <!-- Main lettering: SK (drawn with native paths) -->
  <g transform="translate(25 0)" fill="none" stroke-linejoin="round">
    <!-- soft glow underlay -->
    <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="38">
      <path d="M238 190 H168 A30 30 0 0 0 138 220 V236 A30 30 0 0 0 168 266 H232 A30 30 0 0 1 262 296 V312 A30 30 0 0 1 232 342 H150"/>
      <path d="M330 190 V342"/>
      <path d="M408 190 L340 266 L412 342" stroke-linejoin="miter"/>
    </g>

    <!-- letter S -->
    <path d="M238 190 H168 A30 30 0 0 0 138 220 V236 A30 30 0 0 0 168 266 H232 A30 30 0 0 1 262 296 V312 A30 30 0 0 1 232 342 H150" stroke="url(#silverMain)" stroke-width="26" stroke-linecap="butt"/>

    <!-- letter K -->
    <path d="M330 190 V342" stroke="url(#silverMain)" stroke-width="26" stroke-linecap="butt"/>
    <path d="M408 190 L340 266 L412 342" stroke="url(#silverMain)" stroke-width="26" stroke-linecap="butt" stroke-linejoin="miter"/>

    <!-- fine highlight lines -->
    <path d="M168 181 H238" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
    <path d="M321 181 H339" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7"/>
  </g>

  <!-- Divider line with diamond -->
  <rect x="120" y="368" width="360" height="2" fill="url(#silverLine)"/>
  <path d="M300 359 L309 369 L300 379 L291 369 Z" fill="#000000" stroke="#c9ccd1" stroke-width="2"/>
  <path d="M300 363.5 L304.5 369 L300 374.5 L295.5 369 Z" fill="#e6e8ec"/>

  <!-- Secondary lettering: GRIP PRO -->
  <text x="305" y="424" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, Verdana, sans-serif" font-size="34" font-weight="bold" letter-spacing="10" fill="url(#silverText)">GRIP PRO</text>

  <!-- Bottom accent -->
  <rect x="262" y="462" width="76" height="2" fill="url(#silverLine)"/>
</svg>
