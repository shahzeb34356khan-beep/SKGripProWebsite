```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="gripTitle gripDesc">
  <title id="gripTitle">Magnetic 360-degree rotating phone grip and stand</title>
  <desc id="gripDesc">Front view of a black aluminum-style circular magnetic phone grip with silver metallic highlights on a dark background.</desc>

  <defs>
    <!-- Backdrop -->
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#121214"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>

    <!-- Outer aluminum body -->
    <linearGradient id="bodyMetal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset="0.25" stop-color="#1c1c1f"/>
      <stop offset="0.55" stop-color="#09090a"/>
      <stop offset="0.8" stop-color="#232327"/>
      <stop offset="1" stop-color="#3c3c42"/>
    </linearGradient>

    <!-- Silver rim -->
    <linearGradient id="rimSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#b9bcc2"/>
      <stop offset="0.5" stop-color="#4a4d53"/>
      <stop offset="0.75" stop-color="#9ea2a9"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </linearGradient>

    <!-- Specular edge highlight (fades from top-left) -->
    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Rotating ring -->
    <linearGradient id="ringMetal" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e33"/>
      <stop offset="0.5" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#2a2a2f"/>
    </linearGradient>

    <!-- Main face -->
    <radialGradient id="faceMetal" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="0.45" stop-color="#17171a"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>

    <!-- Magnet plate -->
    <radialGradient id="magnetPlate" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="0.6" stop-color="#101012"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>

    <!-- Center hub -->
    <radialGradient id="hubMetal" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4b4b52"/>
      <stop offset="0.5" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#070708"/>
    </radialGradient>

    <!-- Soft shadow -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="faceClip">
      <circle cx="400" cy="400" r="178"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Ambient glow behind product -->
  <circle cx="400" cy="400" r="300" fill="#ffffff" opacity="0.035"/>
  <circle cx="400" cy="400" r="260" fill="#ffffff" opacity="0.03"/>

  <!-- Drop shadow -->
  <circle cx="412" cy="426" r="232" fill="#000000" opacity="0.85" filter="url(#shadowBlur)"/>

  <!-- Outer body -->
  <circle cx="400" cy="400" r="232" fill="url(#bodyMetal)"/>

  <!-- Silver rim -->
  <circle cx="400" cy="400" r="231" fill="none" stroke="url(#rimSilver)" stroke-width="3"/>
  <circle cx="400" cy="400" r="226" fill="none" stroke="url(#edgeLight)" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="400" r="221" fill="none" stroke="#000000" stroke-width="3" opacity="0.8"/>

  <!-- Rotating ring (knurled grip edge) -->
  <circle cx="400" cy="400" r="203" fill="none" stroke="url(#ringMetal)" stroke-width="30"/>
  <circle cx="400" cy="400" r="203" fill="none" stroke="#5a5a62" stroke-width="30" stroke-dasharray="2.4 5.65" opacity="0.45"/>
  <circle cx="400" cy="400" r="203" fill="none" stroke="#000000" stroke-width="30" stroke-dasharray="1.2 6.85" stroke-dashoffset="3" opacity="0.5"/>

  <!-- Ring edge highlights -->
  <circle cx="400" cy="400" r="218" fill="none" stroke="url(#edgeLight)" stroke-width="1.2" opacity="0.6"/>
  <circle cx="400" cy="400" r="188" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="400" cy="400" r="185" fill="none" stroke="url(#rimSilver)" stroke-width="1.4" opacity="0.8"/>

  <!-- Face -->
  <circle cx="400" cy="400" r="178" fill="url(#faceMetal)"/>

  <!-- Brushed concentric finish -->
  <g fill="none" stroke="#ffffff" clip-path="url(#faceClip)">
    <circle cx="400" cy="400" r="170" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="400" cy="400" r="158" stroke-opacity="0.025" stroke-width="2"/>
    <circle cx="400" cy="400" r="146" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="400" cy="400" r="134" stroke-opacity="0.02" stroke-width="2"/>
    <circle cx="400" cy="400" r="104" stroke-opacity="0.035" stroke-width="1"/>
    <circle cx="400" cy="400" r="92" stroke-opacity="0.02" stroke-width="2"/>
    <circle cx="400" cy="400" r="80" stroke-opacity="0.04" stroke-width="1"/>
  </g>

  <!-- 360-degree rotation indicator arcs -->
  <g fill="none" stroke="url(#rimSilver)" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <circle cx="400" cy="400" r="156" stroke-dasharray="140 70" transform="rotate(-20 400 400)"/>
    <circle cx="400" cy="400" r="156" stroke-dasharray="0.1 1000" stroke-linecap="round" stroke-width="5" transform="rotate(-20 400 400)"/>
  </g>

  <!-- Magnetic ring -->
  <circle cx="400" cy="400" r="122" fill="none" stroke="#000000" stroke-width="6"/>
  <circle cx="400" cy="400" r="119" fill="none" stroke="url(#rimSilver)" stroke-width="1.6" opacity="0.85"/>
  <circle cx="400" cy="400" r="112" fill="url(#magnetPlate)"/>
  <circle cx="400" cy="400" r="112" fill="none" stroke="#000000" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="400" r="104" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Center hub -->
  <circle cx="400" cy="400" r="62" fill="#000000" opacity="0.7" filter="url(#softBlur)" transform="translate(3 5)"/>
  <circle cx="400" cy="400" r="62" fill="url(#hubMetal)"/>
  <circle cx="400" cy="400" r="62" fill="none" stroke="url(#rimSilver)" stroke-width="2.4"/>
  <circle cx="400" cy="400" r="54" fill="none" stroke="#000000" stroke-width="2" opacity="0.8"/>
  <circle cx="400" cy="400" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="400" cy="400" r="12" fill="#050506" stroke="url(#rimSilver)" stroke-width="1.4" opacity="0.9"/>

  <!-- Glossy sweep across the upper face -->
  <g clip-path="url(#faceClip)">
    <path d="M222 400 C 240 270, 360 210, 520 222 C 440 262, 330 320, 222 400 Z" fill="#ffffff" opacity="0.07"/>
    <ellipse cx="330" cy="285" rx="90" ry="34" fill="#ffffff" opacity="0.05" transform="rotate(-28 330 285)"/>
  </g>

  <!-- Specular glints -->
  <path d="M232 318 A 178 178 0 0 1 318 232" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M286 224 A 208 208 0 0 1 350 200" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>
  <path d="M586 548 A 228 228 0 0 1 520 600" fill="none" stroke="#c9ccd1" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
```
