<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600" height="600" viewBox="0 0 600 600">
  <title>SK GRIP PRO premium black magnetic circular phone grip and stand</title>
  <desc>Front view of a black aluminum-style circular magnetic phone grip with subtle silver metallic details on a dark background.</desc>

  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#121214"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>

    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bodyMetal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset="0.25" stop-color="#1c1c1f"/>
      <stop offset="0.55" stop-color="#09090a"/>
      <stop offset="0.8" stop-color="#232327"/>
      <stop offset="1" stop-color="#3c3c42"/>
    </linearGradient>

    <linearGradient id="rimSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#b9bcc2"/>
      <stop offset="0.5" stop-color="#4a4d53"/>
      <stop offset="0.75" stop-color="#9ea2a9"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </linearGradient>

    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="ringMetal" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e33"/>
      <stop offset="0.5" stop-color="#0d0d0f"/>
      <stop offset="1" stop-color="#2a2a2f"/>
    </linearGradient>

    <radialGradient id="faceMetal" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="0.45" stop-color="#17171a"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>

    <radialGradient id="magnetPlate" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="0.6" stop-color="#101012"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>

    <radialGradient id="hubMetal" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#4b4b52"/>
      <stop offset="0.5" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#070708"/>
    </radialGradient>

    <radialGradient id="hubShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="225" fill="#ffffff" fill-opacity="0.035"/>
  <circle cx="300" cy="300" r="195" fill="#ffffff" fill-opacity="0.03"/>

  <!-- Soft drop shadow -->
  <circle cx="309" cy="321" r="212" fill="url(#shadow)"/>

  <!-- Outer body -->
  <circle cx="300" cy="300" r="174" fill="url(#bodyMetal)"/>
  <circle cx="300" cy="300" r="173" fill="none" stroke="url(#rimSilver)" stroke-width="2.5"/>
  <circle cx="300" cy="300" r="169.5" fill="none" stroke="url(#edgeLight)" stroke-width="1.5" stroke-opacity="0.9"/>
  <circle cx="300" cy="300" r="166" fill="none" stroke="#000000" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Rotating knurled ring -->
  <circle cx="300" cy="300" r="152" fill="none" stroke="url(#ringMetal)" stroke-width="22"/>
  <circle cx="300" cy="300" r="152" fill="none" stroke="#5a5a62" stroke-width="22" stroke-dasharray="1.9 4.065" stroke-opacity="0.45"/>
  <circle cx="300" cy="300" r="152" fill="none" stroke="#000000" stroke-width="22" stroke-dasharray="0.9 5.065" stroke-dashoffset="2.4" stroke-opacity="0.5"/>
  <circle cx="300" cy="300" r="163.5" fill="none" stroke="url(#edgeLight)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Inner groove -->
  <circle cx="300" cy="300" r="141" fill="none" stroke="#000000" stroke-width="3"/>
  <circle cx="300" cy="300" r="138.7" fill="none" stroke="url(#rimSilver)" stroke-width="1" stroke-opacity="0.8"/>

  <!-- Face -->
  <circle cx="300" cy="300" r="133" fill="url(#faceMetal)"/>

  <!-- Brushed concentric finish -->
  <g fill="none" stroke="#ffffff">
    <circle cx="300" cy="300" r="127" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="300" cy="300" r="118" stroke-opacity="0.025" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="109" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="300" cy="300" r="78" stroke-opacity="0.035" stroke-width="1"/>
    <circle cx="300" cy="300" r="69" stroke-opacity="0.02" stroke-width="1.5"/>
    <circle cx="300" cy="300" r="60" stroke-opacity="0.04" stroke-width="1"/>
  </g>

  <!-- 360-degree rotation indicator arcs -->
  <g fill="none" stroke="url(#rimSilver)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.55">
    <circle cx="300" cy="300" r="117" stroke-dasharray="105 52.5" transform="rotate(-20 300 300)"/>
  </g>

  <!-- Magnetic ring -->
  <circle cx="300" cy="300" r="91.5" fill="none" stroke="#000000" stroke-width="4.5"/>
  <circle cx="300" cy="300" r="89" fill="none" stroke="url(#rimSilver)" stroke-width="1.2" stroke-opacity="0.85"/>
  <circle cx="300" cy="300" r="84" fill="url(#magnetPlate)"/>
  <circle cx="300" cy="300" r="84" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.9"/>
  <circle cx="300" cy="300" r="78" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Center hub -->
  <circle cx="302" cy="304" r="52" fill="url(#hubShadow)"/>
  <circle cx="300" cy="300" r="46.5" fill="url(#hubMetal)"/>
  <circle cx="300" cy="300" r="46.5" fill="none" stroke="url(#rimSilver)" stroke-width="1.8"/>
  <circle cx="300" cy="300" r="40.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.8"/>
  <circle cx="300" cy="300" r="34.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <circle cx="300" cy="300" r="9" fill="#050506" stroke="url(#rimSilver)" stroke-width="1" stroke-opacity="0.9"/>

  <!-- Glossy sweep on the face -->
  <path d="M190 292 C202 228 268 190 350 192 C300 212 235 246 190 292 Z" fill="#ffffff" fill-opacity="0.07"/>
  <ellipse cx="248" cy="214" rx="62" ry="20" fill="#ffffff" fill-opacity="0.045" transform="rotate(-28 248 214)"/>

  <!-- Specular glints -->
  <path d="M149.3 213 A174 174 0 0 1 213 149.3" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M177.4 197.1 A160 160 0 0 1 232.4 155" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M430.2 409.3 A170 170 0 0 1 371.8 454.1" fill="none" stroke="#c9ccd1" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>
</svg>
