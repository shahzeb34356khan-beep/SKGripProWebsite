```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="standTitle standDesc">
  <title id="standTitle">Smartphone on a premium adjustable stand</title>
  <desc id="standDesc">A smartphone held upright by a sleek black and silver adjustable stand with a round base, hinged neck and cradle, on a luxury dark background.</desc>

  <defs>
    <!-- Backdrop -->
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.85">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#101012"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Silver metallic -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#b9bcc2"/>
      <stop offset="0.5" stop-color="#474a50"/>
      <stop offset="0.75" stop-color="#9ea2a9"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </linearGradient>

    <linearGradient id="silverLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ccd1" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#c9ccd1" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#c9ccd1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c9ccd1" stop-opacity="0"/>
    </linearGradient>

    <!-- Black aluminum (horizontal shading for cylinders) -->
    <linearGradient id="cylH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.12" stop-color="#303036"/>
      <stop offset="0.3" stop-color="#111113"/>
      <stop offset="0.55" stop-color="#08080a"/>
      <stop offset="0.82" stop-color="#27272c"/>
      <stop offset="1" stop-color="#040405"/>
    </linearGradient>

    <!-- Black aluminum (vertical sheen) -->
    <linearGradient id="bodyV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555c"/>
      <stop offset="0.15" stop-color="#26262a"/>
      <stop offset="0.55" stop-color="#09090b"/>
      <stop offset="1" stop-color="#2a2a2f"/>
    </linearGradient>

    <radialGradient id="baseTop" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#3a3a40"/>
      <stop offset="0.5" stop-color="#17171a"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>

    <radialGradient id="barrel" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#57575e"/>
      <stop offset="0.5" stop-color="#1b1b1e"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>

    <!-- Phone body and screen -->
    <linearGradient id="phoneFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b4b52"/>
      <stop offset="0.3" stop-color="#17171a"/>
      <stop offset="0.7" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#3a3a40"/>
    </linearGradient>

    <linearGradient id="screenBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17181d"/>
      <stop offset="0.5" stop-color="#0a0b0e"/>
      <stop offset="1" stop-color="#121318"/>
    </linearGradient>

    <radialGradient id="screenGlow" cx="0.5" cy="0.6" r="0.7">
      <stop offset="0" stop-color="#c9ccd1" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#c9ccd1" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#c9ccd1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="blurLg" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blurSm" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="phoneShadow" x="-30%" y="-10%" width="160%" height="130%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="287" y="102" width="226" height="476" rx="34"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <polygon points="300,0 500,0 700,700 100,700" fill="url(#beam)"/>

  <!-- Floor line, reflection glow and shadows -->
  <rect x="80" y="702" width="640" height="1.2" fill="url(#silverLine)" opacity="0.3"/>
  <ellipse cx="400" cy="706" rx="250" ry="22" fill="#000000" opacity="0.95" filter="url(#blurLg)"/>
  <ellipse cx="400" cy="696" rx="190" ry="9" fill="#000000" opacity="0.9" filter="url(#blurSm)"/>

  <!-- ========== Round base ========== -->
  <path d="M230 666 V686 A170 24 0 0 0 570 686 V666 Z" fill="url(#cylH)"/>
  <path d="M231 686 A169 23 0 0 0 569 686" fill="none" stroke="url(#silver)" stroke-width="1.6" opacity="0.6"/>
  <ellipse cx="400" cy="666" rx="170" ry="24" fill="url(#baseTop)"/>
  <ellipse cx="400" cy="666" rx="169" ry="23" fill="none" stroke="url(#silver)" stroke-width="2.4"/>
  <ellipse cx="400" cy="666" rx="150" ry="19" fill="none" stroke="#000000" stroke-width="3" opacity="0.75"/>
  <ellipse cx="400" cy="666" rx="146" ry="18" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
  <path d="M262 656 A150 20 0 0 1 340 646" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>

  <!-- ========== Smartphone ========== -->
  <!-- Phone drop shadow -->
  <rect x="284" y="104" width="240" height="500" rx="44" fill="#000000" opacity="0.75" filter="url(#phoneShadow)"/>

  <!-- Side buttons -->
  <rect x="524" y="214" width="5" height="62" rx="2.5" fill="url(#bodyV)" stroke="url(#silver)" stroke-width="0.8"/>
  <rect x="271" y="190" width="5" height="40" rx="2.5" fill="url(#bodyV)" stroke="url(#silver)" stroke-width="0.8"/>
  <rect x="271" y="244" width="5" height="40" rx="2.5" fill="url(#bodyV)" stroke="url(#silver)" stroke-width="0.8"/>

  <!-- Phone frame -->
  <rect x="274" y="90" width="252" height="504" rx="46" fill="url(#phoneFrame)"/>
  <rect x="274.8" y="90.8" width="250.4" height="502.4" rx="45.4" fill="none" stroke="url(#silver)" stroke-width="2"/>
  <rect x="279" y="95" width="242" height="494" rx="42" fill="none" stroke="#000000" stroke-width="3" opacity="0.8"/>

  <!-- Screen -->
  <rect x="287" y="102" width="226" height="476" rx="34" fill="url(#screenBase)"/>
  <g clip-path="url(#screenClip)">
    <rect x="287" y="102" width="226" height="476" fill="url(#screenGlow)"/>
    <!-- Abstract silver arcs (decorative wallpaper) -->
    <g fill="none" stroke="#c9ccd1" stroke-linecap="round">
      <circle cx="400" cy="360" r="120" stroke-opacity="0.12" stroke-width="1.5"/>
      <circle cx="400" cy="360" r="86" stroke-opacity="0.16" stroke-width="1.5"/>
      <circle cx="400" cy="360" r="52" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="400" cy="360" r="20" stroke-opacity="0.3" stroke-width="2"/>
    </g>
    <!-- Diagonal glare -->
    <polygon points="287,102 420,102 287,300" fill="url(#glare)"/>
    <polygon points="513,578 513,430 410,578" fill="url(#glare)" opacity="0.5"/>
  </g>
  <!-- Camera cutout -->
  <circle cx="400" cy="122" r="7" fill="#000000" stroke="#2a2a2f" stroke-width="1.6"/>
  <circle cx="398" cy="120" r="2" fill="#ffffff" opacity="0.35"/>
  <!-- Bottom home indicator (plain bar, no text) -->
  <rect x="368" y="560" width="64" height="4" rx="2" fill="#c9ccd1" opacity="0.4"/>

  <!-- Frame glints -->
  <path d="M290 124 A46 46 0 0 1 330 92" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.6"/>
  <path d="M510 92 A46 46 0 0 1 524 126" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.3"/>

  <!-- ========== Adjustable neck ========== -->
  <rect x="382" y="604" width="36" height="58" rx="8" fill="url(#cylH)"/>
  <rect x="382.6" y="604.6" width="34.8" height="56.8" rx="7.4" fill="none" stroke="url(#silver)" stroke-width="1" opacity="0.5"/>
  <rect x="391" y="610" width="3" height="46" rx="1.5" fill="#ffffff" opacity="0.25"/>
  <!-- Collar where neck meets base -->
  <ellipse cx="400" cy="662" rx="34" ry="9" fill="url(#baseTop)" stroke="url(#silver)" stroke-width="1.6"/>

  <!-- Hinge joint -->
  <circle cx="402" cy="634" r="26" fill="#000000" opacity="0.6" filter="url(#blurSm)"/>
  <circle cx="400" cy="632" r="25" fill="url(#barrel)"/>
  <circle cx="400" cy="632" r="25" fill="none" stroke="url(#silver)" stroke-width="2.6"/>
  <circle cx="400" cy="632" r="18" fill="none" stroke="#000000" stroke-width="2.4" opacity="0.85"/>
  <circle cx="400" cy="632" r="14" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <circle cx="400" cy="632" r="7" fill="#050506" stroke="url(#silver)" stroke-width="1.6"/>
  <path d="M383 620 A20 20 0 0 1 396 613" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- ========== Cradle gripping the phone ========== -->
  <rect x="306" y="548" width="188" height="62" rx="20" fill="#000000" opacity="0.55" filter="url(#blurSm)" transform="translate(0 5)"/>
  <rect x="306" y="544" width="188" height="62" rx="20" fill="url(#bodyV)"/>
  <rect x="306.8" y="544.8" width="186.4" height="60.4" rx="19.4" fill="none" stroke="url(#silver)" stroke-width="1.8" opacity="0.85"/>
  <rect x="330" y="548" width="140" height="2.6" rx="1.3" fill="url(#silverLine)"/>
  <rect x="326" y="590" width="148" height="1.4" rx="0.7" fill="url(#silverLine)" opacity="0.4"/>
  <!-- Soft grip pad line where the phone meets the cradle -->
  <rect x="318" y="556" width="164" height="6" rx="3" fill="#000000" opacity="0.7"/>
  <path d="M474 552 A20 20 0 0 1 488 566" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
```
