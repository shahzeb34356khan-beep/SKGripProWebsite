```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="colTitle colDesc">
  <title id="colTitle">Premium smartphone accessory collection</title>
  <desc id="colDesc">A black and silver collection showing a magnetic ring, a compact phone stand and a small mobile accessory case on a luxury dark background.</desc>

  <defs>
    <!-- Backdrop -->
    <radialGradient id="bg" cx="0.5" cy="0.38" r="0.85">
      <stop offset="0" stop-color="#2d2d32"/>
      <stop offset="0.5" stop-color="#111113"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>

    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1d"/>
      <stop offset="0.35" stop-color="#101012"/>
      <stop offset="1" stop-color="#040405"/>
    </linearGradient>

    <!-- Silver metallic -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#b9bcc2"/>
      <stop offset="0.5" stop-color="#474a50"/>
      <stop offset="0.75" stop-color="#9ea2a9"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </linearGradient>

    <linearGradient id="silverLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ccd1" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#c9ccd1" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.8" stop-color="#c9ccd1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c9ccd1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Black aluminum -->
    <linearGradient id="cylH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.12" stop-color="#2e2e34"/>
      <stop offset="0.3" stop-color="#101012"/>
      <stop offset="0.55" stop-color="#08080a"/>
      <stop offset="0.82" stop-color="#26262b"/>
      <stop offset="1" stop-color="#040405"/>
    </linearGradient>

    <linearGradient id="bodyV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55555c"/>
      <stop offset="0.15" stop-color="#27272b"/>
      <stop offset="0.55" stop-color="#09090b"/>
      <stop offset="1" stop-color="#2a2a2f"/>
    </linearGradient>

    <linearGradient id="topBody" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4e4e55"/>
      <stop offset="0.25" stop-color="#1c1c1f"/>
      <stop offset="0.55" stop-color="#09090a"/>
      <stop offset="0.8" stop-color="#232327"/>
      <stop offset="1" stop-color="#3c3c42"/>
    </linearGradient>

    <linearGradient id="panelFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34343a"/>
      <stop offset="0.4" stop-color="#151518"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>

    <linearGradient id="panelEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a8e95"/>
      <stop offset="1" stop-color="#2c2d31"/>
    </linearGradient>

    <radialGradient id="baseTop" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#3a3a40"/>
      <stop offset="0.5" stop-color="#17171a"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>

    <linearGradient id="hingeBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#9ea2a9"/>
      <stop offset="0.6" stop-color="#4a4d53"/>
      <stop offset="1" stop-color="#c9ccd1"/>
    </linearGradient>

    <radialGradient id="caseBody" cx="0.3" cy="0.2" r="1">
      <stop offset="0" stop-color="#3b3b41"/>
      <stop offset="0.45" stop-color="#151518"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>

    <filter id="blurLg" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blurSm" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="holeClip">
      <ellipse cx="230" cy="590" rx="62" ry="25"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <polygon points="300,0 500,0 760,640 40,640" fill="url(#beam)"/>
  <ellipse cx="480" cy="400" rx="260" ry="220" fill="#ffffff" opacity="0.025"/>

  <!-- Floor plane -->
  <rect x="0" y="470" width="800" height="330" fill="url(#floor)"/>
  <rect x="0" y="470" width="800" height="1.4" fill="url(#silverLine)" opacity="0.28"/>

  <g transform="translate(0 -40)">

    <!-- ===================== Compact phone stand ===================== -->
    <!-- shadow -->
    <ellipse cx="490" cy="556" rx="190" ry="32" fill="#000000" opacity="0.95" filter="url(#blurLg)"/>
    <ellipse cx="482" cy="548" rx="150" ry="14" fill="#000000" opacity="0.85" filter="url(#blurSm)"/>

    <!-- base front face -->
    <path d="M360 545 L600 545 L600 561 Q600 566 595 566 L365 566 Q360 566 360 561 Z" fill="url(#cylH)"/>
    <path d="M361 561 L599 561" stroke="url(#silver)" stroke-width="1.4" opacity="0.55"/>
    <!-- base top face -->
    <path d="M400 500 L560 500 L600 545 L360 545 Z" fill="url(#baseTop)" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <path d="M410 509 L552 509 L584 538 L376 538 Z" fill="none" stroke="#000000" stroke-width="2.6" opacity="0.7" stroke-linejoin="round"/>
    <path d="M404 504 L472 504" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

    <!-- back panel (side edge) -->
    <path d="M555 500 L570 497 L540 322 L528 322 Z" fill="url(#panelEdge)"/>
    <!-- back panel (front face) -->
    <path d="M405 500 L555 500 L528 322 L432 322 Z" fill="url(#panelFace)" stroke="url(#silver)" stroke-width="2" stroke-linejoin="round"/>
    <!-- brushed lines -->
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
      <path d="M418 480 L440 340"/>
      <path d="M440 480 L458 340"/>
      <path d="M462 480 L476 340"/>
      <path d="M484 480 L494 340"/>
      <path d="M506 480 L512 340"/>
    </g>
    <path d="M440 326 L520 326" stroke="url(#silverLine)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M437 340 L418 478" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
    <!-- panel gloss -->
    <path d="M432 322 L480 322 L452 500 L405 500 Z" fill="#ffffff" opacity="0.04"/>

    <!-- hinge bar -->
    <rect x="404" y="492" width="152" height="16" rx="8" fill="url(#hingeBar)"/>
    <rect x="404" y="492" width="152" height="16" rx="8" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="416" y="494.5" width="128" height="2.2" rx="1.1" fill="#ffffff" opacity="0.7"/>

    <!-- cradle lip -->
    <path d="M420 524 L540 524 L552 536 L408 536 Z" fill="url(#bodyV)" stroke="url(#silver)" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M408 536 L552 536 L552 543 L408 543 Z" fill="url(#cylH)"/>
    <path d="M424 527 L520 527" stroke="url(#silverLine)" stroke-width="1.6" opacity="0.8"/>

    <!-- ===================== Magnetic ring ===================== -->
    <!-- shadow -->
    <ellipse cx="242" cy="648" rx="160" ry="26" fill="#000000" opacity="0.95" filter="url(#blurLg)"/>
    <ellipse cx="236" cy="640" rx="132" ry="11" fill="#000000" opacity="0.85" filter="url(#blurSm)"/>

    <!-- side wall -->
    <path d="M100 590 V612 A130 52 0 0 0 360 612 V590 Z" fill="url(#cylH)"/>
    <path d="M101 612 A129 51 0 0 0 359 612" fill="none" stroke="url(#silver)" stroke-width="1.6" opacity="0.6"/>
    <path d="M118 636 A118 46 0 0 0 190 656" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.3"/>

    <!-- top face -->
    <ellipse cx="230" cy="590" rx="130" ry="52" fill="url(#topBody)"/>
    <ellipse cx="230" cy="590" rx="129" ry="51" fill="none" stroke="url(#silver)" stroke-width="2.6"/>
    <ellipse cx="230" cy="590" rx="125" ry="49" fill="none" stroke="url(#edgeLight)" stroke-width="1.8" opacity="0.9"/>
    <ellipse cx="230" cy="590" rx="108" ry="43" fill="none" stroke="#000000" stroke-width="3" opacity="0.7"/>
    <ellipse cx="230" cy="590" rx="104" ry="41" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <ellipse cx="230" cy="590" rx="82" ry="33" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

    <!-- center opening with visible inner wall -->
    <ellipse cx="230" cy="590" rx="64" ry="26" fill="#000000"/>
    <g clip-path="url(#holeClip)">
      <ellipse cx="230" cy="590" rx="62" ry="25" fill="url(#cylH)"/>
      <ellipse cx="230" cy="612" rx="62" ry="25" fill="#0a0a0c"/>
    </g>
    <ellipse cx="230" cy="590" rx="62" ry="25" fill="none" stroke="url(#silver)" stroke-width="1.8"/>

    <!-- ring glints -->
    <path d="M122 570 A130 52 0 0 1 176 548" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.6"/>
    <path d="M196 542 A116 46 0 0 1 270 540" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

    <!-- ===================== Small accessory case ===================== -->
    <!-- shadow -->
    <ellipse cx="652" cy="672" rx="100" ry="18" fill="#000000" opacity="0.95" filter="url(#blurLg)"/>
    <ellipse cx="650" cy="666" rx="74" ry="8" fill="#000000" opacity="0.85" filter="url(#blurSm)"/>

    <!-- top face -->
    <path d="M610 590 Q610 582 622 582 L688 582 Q700 582 700 590 L706 604 L596 604 Z" fill="url(#baseTop)" stroke="url(#silver)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M626 586 L684 586" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

    <!-- front body -->
    <rect x="596" y="600" width="110" height="62" rx="24" fill="url(#caseBody)"/>
    <rect x="596.8" y="600.8" width="108.4" height="60.4" rx="23.4" fill="none" stroke="url(#silver)" stroke-width="1.8" opacity="0.85"/>
    <!-- lid seam -->
    <path d="M598 624 Q651 630 704 624" fill="none" stroke="#000000" stroke-width="3" opacity="0.85"/>
    <path d="M598 626 Q651 632 704 626" fill="none" stroke="url(#silver)" stroke-width="1" opacity="0.5"/>
    <!-- small round button -->
    <circle cx="651" cy="646" r="6" fill="#050506" stroke="url(#silver)" stroke-width="1.6"/>
    <circle cx="651" cy="646" r="2" fill="#c9ccd1" opacity="0.35"/>
    <!-- highlights -->
    <path d="M610 614 A24 24 0 0 1 626 603" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>
    <path d="M692 654 A24 24 0 0 1 678 661" fill="none" stroke="#c9ccd1" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
```
