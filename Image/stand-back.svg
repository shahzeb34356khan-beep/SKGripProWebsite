```svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="backTitle backDesc">
  <title id="backTitle">Magnetic rotating phone grip and stand, back view</title>
  <desc id="backDesc">Back view of a black magnetic phone grip showing the circular rear magnetic surface with subtle silver metallic highlights on a dark luxury background.</desc>

  <defs>
    <!-- Backdrop -->
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#111113"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>

    <!-- Outer body -->
    <linearGradient id="bodyMetal" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4c4c53"/>
      <stop offset="0.25" stop-color="#1b1b1e"/>
      <stop offset="0.55" stop-color="#08080a"/>
      <stop offset="0.8" stop-color="#222226"/>
      <stop offset="1" stop-color="#3d3d43"/>
    </linearGradient>

    <!-- Silver rim -->
    <linearGradient id="rimSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#b9bcc2"/>
      <stop offset="0.5" stop-color="#474a50"/>
      <stop offset="0.75" stop-color="#9ea2a9"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </linearGradient>

    <!-- Edge highlight fading from top-left -->
    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Matte rear face -->
    <radialGradient id="matteFace" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#242428"/>
      <stop offset="0.5" stop-color="#121214"/>
      <stop offset="1" stop-color="#060607"/>
    </radialGradient>

    <!-- Magnet ring (steel-dark) -->
    <linearGradient id="magnetRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4a52"/>
      <stop offset="0.3" stop-color="#202024"/>
      <stop offset="0.6" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#34343a"/>
    </linearGradient>

    <!-- Center disc -->
    <radialGradient id="centerDisc" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#2d2d32"/>
      <stop offset="0.55" stop-color="#121214"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>

    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="bodyClip">
      <circle cx="400" cy="400" r="214"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="300" fill="#ffffff" opacity="0.035"/>
  <circle cx="400" cy="400" r="262" fill="#ffffff" opacity="0.03"/>

  <!-- Drop shadow -->
  <circle cx="410" cy="424" r="232" fill="#000000" opacity="0.85" filter="url(#shadowBlur)"/>

  <!-- Outer body -->
  <circle cx="400" cy="400" r="232" fill="url(#bodyMetal)"/>
  <circle cx="400" cy="400" r="231" fill="none" stroke="url(#rimSilver)" stroke-width="3"/>
  <circle cx="400" cy="400" r="226" fill="none" stroke="url(#edgeLight)" stroke-width="2" opacity="0.9"/>
  <circle cx="400" cy="400" r="220" fill="none" stroke="#000000" stroke-width="4" opacity="0.85"/>

  <!-- Rear matte face -->
  <circle cx="400" cy="400" r="214" fill="url(#matteFace)"/>

  <!-- Fine matte texture rings -->
  <g fill="none" stroke="#ffffff" clip-path="url(#bodyClip)">
    <circle cx="400" cy="400" r="208" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="400" cy="400" r="198" stroke-opacity="0.025" stroke-width="2"/>
    <circle cx="400" cy="400" r="188" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="400" cy="400" r="86" stroke-opacity="0.03" stroke-width="1"/>
    <circle cx="400" cy="400" r="74" stroke-opacity="0.02" stroke-width="2"/>
    <circle cx="400" cy="400" r="62" stroke-opacity="0.035" stroke-width="1"/>
  </g>

  <!-- Outer groove before magnet ring -->
  <circle cx="400" cy="400" r="176" fill="none" stroke="#000000" stroke-width="5"/>
  <circle cx="400" cy="400" r="173" fill="none" stroke="url(#rimSilver)" stroke-width="1.4" opacity="0.8"/>

  <!-- Magnetic ring -->
  <circle cx="400" cy="400" r="150" fill="none" stroke="url(#magnetRing)" stroke-width="44"/>
  <!-- Ring surface sheen -->
  <circle cx="400" cy="400" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="30"/>
  <!-- Ring brushed lines -->
  <circle cx="400" cy="400" r="158" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="400" cy="400" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <circle cx="400" cy="400" r="142" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <!-- Ring inner edge -->
  <circle cx="400" cy="400" r="127" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="400" cy="400" r="124.5" fill="none" stroke="url(#rimSilver)" stroke-width="1.4" opacity="0.8"/>

  <!-- Soft specular arcs on the magnet ring -->
  <g fill="none" stroke-linecap="round">
    <path d="M262 330 A 150 150 0 0 1 336 262" stroke="#ffffff" stroke-width="5" opacity="0.28"/>
    <path d="M538 470 A 150 150 0 0 1 464 538" stroke="#c9ccd1" stroke-width="4" opacity="0.18"/>
  </g>

  <!-- Center disc -->
  <circle cx="400" cy="400" r="108" fill="#000000" opacity="0.55" filter="url(#softBlur)" transform="translate(2 4)"/>
  <circle cx="400" cy="400" r="108" fill="url(#centerDisc)"/>
  <circle cx="400" cy="400" r="108" fill="none" stroke="url(#rimSilver)" stroke-width="2" opacity="0.85"/>
  <circle cx="400" cy="400" r="100" fill="none" stroke="#000000" stroke-width="3" opacity="0.85"/>
  <circle cx="400" cy="400" r="94" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Gloss sweep across upper-left -->
  <g clip-path="url(#bodyClip)">
    <path d="M190 400 C 205 262, 340 188, 520 196 C 430 236, 300 306, 190 400 Z" fill="#ffffff" opacity="0.06"/>
    <ellipse cx="318" cy="280" rx="96" ry="30" fill="#ffffff" opacity="0.045" transform="rotate(-30 318 280)"/>
  </g>

  <!-- Rim specular glints -->
  <path d="M232 318 A 178 178 0 0 1 318 232" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35" transform="translate(-12 -12) scale(1.06) translate(-24 -24)"/>
  <path d="M276 214 A 214 214 0 0 1 352 190" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" opacity="0.65"/>
  <path d="M588 556 A 228 228 0 0 1 520 606" fill="none" stroke="#c9ccd1" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
```
