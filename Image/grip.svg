<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="tqTitle tqDesc">
  <title id="tqTitle">Premium black magnetic phone grip, three-quarter view</title>
  <desc id="tqDesc">Front three-quarter view of a circular black magnetic phone grip with a knurled ring, silver metallic highlights and visible thickness on a luxury dark background.</desc>

  <defs>
    <!-- Backdrop -->
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0" stop-color="#2c2c31"/>
      <stop offset="0.5" stop-color="#111113"/>
      <stop offset="1" stop-color="#020202"/>
    </radialGradient>

    <!-- Light beam -->
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Side wall (thickness) -->
    <linearGradient id="sideWall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.12" stop-color="#2e2e34"/>
      <stop offset="0.3" stop-color="#101012"/>
      <stop offset="0.55" stop-color="#08080a"/>
      <stop offset="0.82" stop-color="#26262b"/>
      <stop offset="1" stop-color="#040405"/>
    </linearGradient>

    <!-- Top body -->
    <linearGradient id="topBody" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4e4e55"/>
      <stop offset="0.25" stop-color="#1c1c1f"/>
      <stop offset="0.55" stop-color="#09090a"/>
      <stop offset="0.8" stop-color="#232327"/>
      <stop offset="1" stop-color="#3c3c42"/>
    </linearGradient>

    <!-- Silver metallic -->
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#b9bcc2"/>
      <stop offset="0.5" stop-color="#474a50"/>
      <stop offset="0.75" stop-color="#9ea2a9"/>
      <stop offset="1" stop-color="#e6e8ec"/>
    </linearGradient>

    <linearGradient id="edgeLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Knurled ring body -->
    <linearGradient id="ringBody" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303036"/>
      <stop offset="0.5" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#2a2a2f"/>
    </linearGradient>

    <!-- Face -->
    <radialGradient id="faceGrad" cx="0.35" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#36363c"/>
      <stop offset="0.45" stop-color="#18181b"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>

    <radialGradient id="magnetGrad" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.6" stop-color="#101012"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>

    <radialGradient id="hubGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#4c4c53"/>
      <stop offset="0.5" stop-color="#1a1a1d"/>
      <stop offset="1" stop-color="#070708"/>
    </radialGradient>

    <filter id="blurLg" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blurSm" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="faceClip">
      <ellipse cx="400" cy="400" rx="178" ry="116"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>
  <polygon points="290,0 510,0 720,620 80,620" fill="url(#beam)"/>

  <!-- Floor reflection line and shadow -->
  <rect x="80" y="610" width="640" height="1.2" fill="#c9ccd1" opacity="0.14"/>
  <ellipse cx="418" cy="572" rx="268" ry="62" fill="#000000" opacity="0.95" filter="url(#blurLg)"/>
  <ellipse cx="410" cy="560" rx="226" ry="30" fill="#000000" opacity="0.9" filter="url(#blurSm)"/>

  <!-- Whole product, tilted slightly for a three-quarter feel -->
  <g transform="translate(0 -22) rotate(-12 400 400)">

    <!-- Side wall (thickness) -->
    <path d="M170 400 V446 A230 150 0 0 0 630 446 V400 Z" fill="url(#sideWall)"/>
    <!-- Wall edge details -->
    <path d="M171 446 A229 149 0 0 0 629 446" fill="none" stroke="url(#silver)" stroke-width="1.6" opacity="0.55"/>
    <path d="M176 438 A224 144 0 0 0 624 438" fill="none" stroke="#000000" stroke-width="3" opacity="0.65"/>
    <!-- Wall sheen -->
    <path d="M196 478 A214 138 0 0 0 330 540" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.3"/>

    <!-- Top outer body -->
    <ellipse cx="400" cy="400" rx="230" ry="150" fill="url(#topBody)"/>
    <ellipse cx="400" cy="400" rx="229" ry="149" fill="none" stroke="url(#silver)" stroke-width="3"/>
    <ellipse cx="400" cy="400" rx="224" ry="145" fill="none" stroke="url(#edgeLight)" stroke-width="2" opacity="0.9"/>
    <ellipse cx="400" cy="400" rx="219" ry="141" fill="none" stroke="#000000" stroke-width="3" opacity="0.8"/>

    <!-- Knurled rotating ring -->
    <ellipse cx="400" cy="400" rx="202" ry="130" fill="none" stroke="url(#ringBody)" stroke-width="28"/>
    <ellipse cx="400" cy="400" rx="202" ry="130" pathLength="220" fill="none" stroke="#63636b" stroke-width="28" stroke-dasharray="1 1" opacity="0.4"/>
    <ellipse cx="400" cy="400" rx="202" ry="130" pathLength="220" fill="none" stroke="#000000" stroke-width="28" stroke-dasharray="0.5 1.5" stroke-dashoffset="0.7" opacity="0.5"/>
    <ellipse cx="400" cy="400" rx="216" ry="139" fill="none" stroke="url(#edgeLight)" stroke-width="1.2" opacity="0.55"/>

    <!-- Inner groove -->
    <ellipse cx="400" cy="400" rx="187" ry="120" fill="none" stroke="#000000" stroke-width="4"/>
    <ellipse cx="400" cy="400" rx="184" ry="118" fill="none" stroke="url(#silver)" stroke-width="1.4" opacity="0.8"/>

    <!-- Face -->
    <ellipse cx="400" cy="400" rx="178" ry="116" fill="url(#faceGrad)"/>

    <!-- Brushed concentric finish -->
    <g fill="none" stroke="#ffffff" clip-path="url(#faceClip)">
      <ellipse cx="400" cy="400" rx="168" ry="109" stroke-opacity="0.04" stroke-width="1"/>
      <ellipse cx="400" cy="400" rx="154" ry="100" stroke-opacity="0.025" stroke-width="2"/>
      <ellipse cx="400" cy="400" rx="140" ry="91" stroke-opacity="0.04" stroke-width="1"/>
      <ellipse cx="400" cy="400" rx="96" ry="62" stroke-opacity="0.035" stroke-width="1"/>
      <ellipse cx="400" cy="400" rx="84" ry="54" stroke-opacity="0.04" stroke-width="1"/>
    </g>

    <!-- Magnetic ring -->
    <ellipse cx="400" cy="400" rx="124" ry="80" fill="none" stroke="#000000" stroke-width="6"/>
    <ellipse cx="400" cy="400" rx="121" ry="78" fill="none" stroke="url(#silver)" stroke-width="1.6" opacity="0.85"/>
    <ellipse cx="400" cy="400" rx="113" ry="73" fill="url(#magnetGrad)"/>
    <ellipse cx="400" cy="400" rx="105" ry="68" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Center hub (slightly raised) -->
    <ellipse cx="404" cy="414" rx="64" ry="41" fill="#000000" opacity="0.65" filter="url(#blurSm)"/>
    <path d="M336 402 V410 A64 41 0 0 0 464 410 V402 Z" fill="url(#sideWall)"/>
    <path d="M337 410 A63 40 0 0 0 463 410" fill="none" stroke="url(#silver)" stroke-width="1.2" opacity="0.6"/>
    <ellipse cx="400" cy="402" rx="64" ry="41" fill="url(#hubGrad)"/>
    <ellipse cx="400" cy="402" rx="64" ry="41" fill="none" stroke="url(#silver)" stroke-width="2.2"/>
    <ellipse cx="400" cy="402" rx="55" ry="35" fill="none" stroke="#000000" stroke-width="2" opacity="0.8"/>
    <ellipse cx="400" cy="402" rx="47" ry="30" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

    <!-- Glossy sweep -->
    <g clip-path="url(#faceClip)">
      <path d="M222 400 C 238 306, 350 262, 512 276 C 436 300, 322 336, 222 400 Z" fill="#ffffff" opacity="0.07"/>
      <ellipse cx="320" cy="334" rx="86" ry="22" fill="#ffffff" opacity="0.05" transform="rotate(-24 320 334)"/>
    </g>

    <!-- Rim specular glints -->
    <path d="M226 350 A230 150 0 0 1 304 282" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M330 262 A216 140 0 0 1 430 254" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
    <path d="M586 462 A228 148 0 0 1 520 522" fill="none" stroke="#c9ccd1" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
